server:
  port: 8080
  mode: debug

database:
  host: localhost
  port: 3306
  user: root
  password: qynfqepwq
  dbname: recharge-new
  max_idle_conns: 10
  max_open_conns: 100
  conn_max_lifetime: 3600

jwt:
  secret: recharge-new
  expire: 24 # hours
  refresh_secret: recharge-new-refresh
  refresh_expire: 168 # hours (7 days)

log:
  level: debug
  filename: logs/app.log
  max_size: 100
  max_backups: 10
  max_age: 30

redis:
  host: localhost
  port: 6379
  password: ""
  db: 0

notification:
  max_retries: 3
  batch_size: 10

task:
  interval: 30
  order_details_interval: 60
  max_retries: 3
  retry_delay: 3           # 重试延迟优化为3秒
  max_concurrent: 50
  batch_size: 100
  suspend_threshold: 1000  # 处理中订单数量达到此值时暂停拉单
  resume_threshold: 800    # 处理中订单数量降到此值时恢复拉单
  concurrency: 10

# 重试任务专用配置
retry_task:
  interval: 30           # 重试任务执行间隔（秒）
  max_retries: 3         # 最大重试次数
  retry_delay: 3         # 重试延迟（秒）- 优化为3秒实现秒级充值
  batch_size: 10         # 批量处理数量
  timeout: 300           # 超时时间（秒）
  queue_name: "retry_queue"  # 重试队列名称
  consumer_count: 2      # 消费者数量
  poll_interval: 1       # 队列轮询间隔（秒）

api:
  key: "" # API密钥
  user_id: "" # 用户ID
  base_url: "" # API基础URL

xingchen:
  default_ip: "61.51.110.34" # 兴辰网络下单默认ip（未在platform_apis.extra_params.ip配置时使用）

# 第三方API配置
third_party_api:
  base_url: "http://35.220.200.84:18080"  # 第三方API基础URL
  merchant_id: "250705SY"         # 商户号（需要替换为实际值）
  token: "5eb38f73b40f4b6aa48da3cc7027a0c1"                     # 访问令牌（需要替换为实际值）
  timeout: 30                             # 请求超时时间（秒）

security:
  jwt:
    skip_paths:
      - /api/v1/user/login
      - /health
  rate_limit:
    enabled: true
    rps: 1
    burst: 1
    include_paths:
      - /api/v1/user/login
      - /api/v1/user/register
  cors:
    allow_origins: ["*"]
    allow_methods: ["GET","POST","OPTIONS"]
    allow_headers: ["Authorization","Content-Type","X-Request-ID"]
    expose_headers: []
    allow_credentials: false
    max_age: 600
    skip_paths:
      - /health  
